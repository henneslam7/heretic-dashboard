<meta charset="UTF-8">
<title>Heretic Client Portal</title>
<meta name="description" content="Heretic Digital Client Portal">
<meta property="og:title" content="Heretic Client Portal">
<meta property="og:description" content="Heretic Digital Client Portal">
<link rel="icon" href="favicon.png">
<style>
  :root{
    --bg:#15171b; --panel:#1d2026; --panel2:#23262e; --line:#2c3038;
    --ink:#eceef2; --ink-dim:#9aa0ac; --accent:#6ee7d0; --accent-dim:#2d4a44;
    --warn:#f2b155; --danger:#f26d6d; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px;}
  h1{font-size:20px;font-weight:700;letter-spacing:-0.01em;margin:0 0 2px;}
  .sub{color:var(--ink-dim);font-size:13px;margin:0 0 20px;}
  .brand-logo{display:inline-block;height:96px;width:auto;margin:4px 0 14px;}
  .toprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  select, input, textarea, button{
    font-family:inherit;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;
  }
  select{min-width:160px;}
  button{cursor:pointer;background:var(--panel2);transition:border-color .15s;}
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);color:#0c1210;border-color:var(--accent);font-weight:600;}
  button.danger{color:var(--danger);}
  button.small{padding:4px 8px;font-size:12px;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  .tab{padding:9px 14px;font-size:13px;color:var(--ink-dim);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--ink);border-color:var(--accent);}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:640px){.grid3{grid-template-columns:1fr;}}
  .quota-card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;}
  .quota-card .label{font-size:12px;color:var(--ink-dim);letter-spacing:.04em;margin-bottom:6px;}
  .quota-card .nums{font-size:22px;font-weight:700;}
  .quota-card .nums span{font-size:13px;color:var(--ink-dim);font-weight:400;}
  .bar{height:6px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden;}
  .bar > div{height:100%;background:var(--accent);}
  .bar.over > div{background:var(--danger);}
  .qctrl{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap;}
  .qctrl input{width:56px;padding:4px 6px;text-align:center;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--ink-dim);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .status-pill{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .status-launched{background:#1f3d2e;color:#7fe0a3;}
  .status-scheduled{background:#3a3420;color:#f2c866;}
  .status-ended{background:#33262b;color:#d98a8a;}
  .row-actions{display:flex;gap:4px;}
  .empty{color:var(--ink-dim);font-size:13px;padding:20px;text-align:center;}
  .field-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px;}
  @media(max-width:640px){.field-row{grid-template-columns:repeat(2,1fr);}}
  .field-row label{font-size:11px;color:var(--ink-dim);display:block;margin-bottom:3px;}
  .field-row input, .field-row select{width:100%;}
  .section-label{font-size:12px;color:var(--accent);font-weight:600;margin:12px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
  textarea.json{width:100%;height:180px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;}
  .schema{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--ink-dim);white-space:pre;overflow-x:auto;}
  .msg{font-size:12.5px;padding:8px 10px;border-radius:6px;margin-top:8px;}
  .msg.ok{background:#1f3d2e;color:#7fe0a3;}
  .msg.err{background:#3d2020;color:#f29a9a;}
  .footer-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .totals{font-size:12px;color:var(--ink-dim);margin-top:4px;}
  .lockwrap{max-width:360px;margin:80px auto;text-align:center;}
  .lockwrap input{width:100%;margin:12px 0;text-align:center;font-size:16px;letter-spacing:2px;}
  .client-card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;}
  .client-card h3{margin:0 0 6px;font-size:15px;}
  .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 16px;font-size:12.5px;color:var(--ink-dim);margin-top:8px;}
  .kv b{color:var(--ink);font-weight:600;word-break:break-word;}
  .sharebox{display:flex;gap:6px;margin-top:8px;}
  .sharebox input{flex:1;font-size:11px;}
  .campaign-card{margin-bottom:16px;}
  .campaign-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;}
  .campaign-head h3{margin:0;font-size:15px;}
  .obj-pill{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:var(--accent-dim);color:var(--accent);}
  .adset-block{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px;}
  .adset-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .status-budget{background:#3d2e1a;color:var(--warn);}
  .tablewrap{overflow-x:auto;}
  .cal-head{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:4px;}
  .cal-title{font-size:14px;font-weight:600;min-width:110px;text-align:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-weekdays{margin-bottom:4px;}
  .cal-weekday{text-align:center;font-size:11px;color:var(--ink-dim);padding:2px 0;}
  .cal-day{position:relative;min-height:64px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 4px 20px;}
  .cal-day.empty{background:transparent;border-color:transparent;}
  .cal-daynum{font-size:10.5px;color:var(--ink-dim);margin-bottom:3px;}
  .cal-post{font-size:10px;line-height:1.3;border-radius:4px;padding:2px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;}
  .cal-post[data-editpost]{cursor:pointer;}
  .cal-post.static{background:var(--accent-dim);color:var(--accent);}
  .cal-post.carousel{background:#3a3420;color:#f2c866;}
  .cal-post.reels{background:#33263d;color:#c99af2;}
  .cal-add{position:absolute;bottom:2px;right:3px;padding:0 5px;font-size:11px;line-height:1.6;border-radius:4px;}
  .cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--ink-dim);}
  .cal-legend-item{display:inline-flex;align-items:center;gap:5px;}
  .cal-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .cal-dot.static{background:var(--accent);}
  .cal-dot.carousel{background:#f2c866;}
  .cal-dot.reels{background:#c99af2;}
  .cal-post-draft{border:1px dashed var(--ink-dim);background:transparent!important;color:var(--ink-dim)!important;}
  .admin-only-note{font-size:11px;color:var(--ink-dim);margin:2px 0 10px;}
  .hours-summary{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;}
  .hours-stat{font-size:12.5px;color:var(--ink-dim);}
  .hours-stat b{color:var(--ink);font-weight:700;}
  .noundated-block{margin-top:12px;}
  .campaign-strip-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);}
  .campaign-strip-row:last-child{border-bottom:none;}
  .campaign-label{font-size:11.5px;color:var(--ink-dim);margin-bottom:8px;}
  .adset-block-top{margin-top:10px;}
  .changelog{font-size:12px;color:var(--ink-dim);}
  .changelog-entry{padding:5px 0;border-bottom:1px solid var(--line);}
  .changelog-entry:last-child{border-bottom:none;}
  .changelog-entry b{color:var(--ink);font-size:11.5px;}
  .changelog-entry-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px;}
  .changelog-del{padding:2px 7px;font-size:10.5px;}
  .campaign-group{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;}
  .campaign-group-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:2px;}
  .campaign-group-name{font-size:17px;font-weight:700;}
  .adset-block{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  .adset-block:first-of-type{margin-top:12px;padding-top:12px;}
  .adset-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .adset-name{font-size:13.5px;font-weight:600;color:var(--ink-dim);}
  .collapse-row{display:flex;align-items:center;gap:6px;}
  .collapse-btn{background:none;border:none;color:var(--ink-dim);cursor:pointer;font-size:13px;padding:2px 4px;line-height:1;flex-shrink:0;}
  .collapse-btn:hover{color:var(--ink);}
  .ad-stat-name-row .collapse-row{align-items:flex-start;}
  .meta-row{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 14px;font-size:12.5px;color:var(--ink-dim);}
  .meta-row span b{color:var(--ink);font-weight:600;}
  .section-h{font-size:11.5px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:12px;color:var(--ink);}
  .chip.dim{color:var(--ink-dim);}
  .interest-chips{margin-top:8px;}
  .ad-stat-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;}
  .ad-stat-card:last-child{margin-bottom:0;}
  .ad-stat-name-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .ad-stat-name{font-size:12.5px;color:var(--ink-dim);}
  .ad-stat-hero{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;}
  .ad-stat-hero .num{font-size:22px;font-weight:700;color:var(--accent);}
  .ad-stat-hero .lbl{font-size:12px;color:var(--ink-dim);}
  .ad-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:11.5px;color:var(--ink-dim);}
  .ad-stat-grid b{display:block;color:var(--ink);font-size:13px;font-weight:700;margin-bottom:1px;}
  @media(max-width:640px){.ad-stat-grid{grid-template-columns:repeat(2,1fr);}}
  .insight-body{font-size:13px;line-height:1.65;color:var(--ink);margin-top:2px;}
  .insight-body p{margin:0 0 10px;}
  .insight-body p:last-child{margin-bottom:0;}
  .insight-body p.summary{color:var(--ink-dim);}
  .insight-label{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:14px;margin-bottom:6px;}
  .insight-label:first-of-type{margin-top:12px;}
  @media(max-width:640px){
    .cal-day{min-height:46px;padding:2px 2px 18px;}
    .cal-post{font-size:9px;padding:1px 3px;}
    .cal-add{font-size:10px;padding:0 3px;}
  }

  /* ---------- admin Ads tab: month view + inline editors ---------- */
  .ads-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .year-nav{display:flex;align-items:center;gap:8px;}
  .year-label{font-size:15px;font-weight:700;min-width:60px;text-align:center;}
  .month-pills{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-bottom:14px;}
  .month-pill{position:relative;padding:8px 0;font-size:12.5px;text-align:center;color:var(--ink-dim);background:var(--panel);}
  .month-pill i{font-style:normal;position:absolute;top:2px;right:4px;font-size:9.5px;line-height:1;color:var(--accent);}
  .month-pill.cur{border-color:var(--ink-dim);}
  .month-pill.active{background:var(--accent);border-color:var(--accent);color:#0c1210;font-weight:700;}
  .month-pill.active i{color:#0c1210;}
  @media(max-width:640px){.month-pills{grid-template-columns:repeat(6,1fr);}}
  .ads-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  @media(max-width:640px){.ads-summary{grid-template-columns:repeat(2,1fr);}}
  .sum-tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  .sum-tile .k{font-size:11px;color:var(--ink-dim);margin-bottom:3px;}
  .sum-tile .v{font-size:18px;font-weight:700;}
  .sum-tile .v span{font-size:12px;font-weight:500;color:var(--ink-dim);margin-left:6px;}
  .camp-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
  .camp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .camp-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;}
  .camp-title .obj-pill{margin-top:0;}
  .camp-name{font-size:16px;font-weight:700;word-break:break-word;}
  .link-btn{background:none;border:none;padding:6px 0 0;color:var(--ink-dim);font-size:12px;}
  .link-btn:hover{color:var(--accent);}
  .insight-wrap{background:var(--panel2);border-radius:8px;padding:2px 14px 12px;margin-top:6px;}
  .as-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px;}
  .as-head{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;}
  .as-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;}
  .as-name{font-size:14px;font-weight:600;word-break:break-word;}
  .chev{color:var(--ink-dim);font-size:12px;width:12px;}
  .as-stats{display:grid;grid-template-columns:1.1fr 1.6fr 1fr 1.2fr .8fr;gap:12px;margin:10px 0 4px;}
  @media(max-width:760px){.as-stats{grid-template-columns:repeat(2,1fr);}}
  .as-stat .k{font-size:11px;color:var(--ink-dim);margin-bottom:2px;}
  .as-stat .v{font-size:13.5px;font-weight:700;}
  .as-stat .v span{font-weight:400;color:var(--ink-dim);font-size:12px;}
  .as-stat .v.accent{color:var(--accent);}
  .bar.mini{height:4px;margin-top:5px;}
  .as-details{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;}
  .ad-table{margin-top:10px;border-top:1px solid var(--line);}
  .ad-row{display:grid;grid-template-columns:minmax(0,2.4fr) repeat(4,minmax(0,1fr)) 24px;gap:8px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);font-size:12.5px;}
  .ad-row.head{font-size:11px;color:var(--ink-dim);font-weight:600;padding:6px;}
  .ad-row:not(.head){cursor:pointer;border-radius:6px;transition:background .12s;}
  .ad-row:not(.head):hover,.ad-row:not(.head):focus-visible{background:rgba(110,231,208,.07);outline:none;}
  .ad-row.editing{background:rgba(110,231,208,.1);border-bottom-color:transparent;}
  .ad-row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
  .ad-row .go{color:var(--ink-dim);text-align:right;}
  .ad-row:hover .go{color:var(--accent);}
  @media(max-width:640px){
    .ad-row.head{display:none;}
    .ad-row{grid-template-columns:repeat(4,1fr) 24px;row-gap:6px;}
    .ad-row .name{grid-column:1/5;}
    .ad-row .go{grid-column:5;grid-row:1;}
    .ad-row .c[data-l]::before{content:attr(data-l);display:block;font-size:10px;color:var(--ink-dim);font-weight:400;}
  }
  .add-row{width:100%;margin-top:8px;border-style:dashed;background:transparent;color:var(--ink-dim);}
  .add-row:hover{color:var(--accent);}
  .empty.slim{padding:10px;}
  .editor{background:var(--bg);border:1px solid var(--accent-dim);border-left:3px solid var(--accent);border-radius:8px;padding:14px 16px;margin:8px 0 12px;animation:editorIn .16s ease-out;}
  @keyframes editorIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .editor-title{font-size:13.5px;font-weight:700;}
  .editor-title .crumb{font-weight:400;color:var(--ink-dim);font-size:12px;margin-left:6px;}
  .icon-btn{background:none;border:none;color:var(--ink-dim);padding:2px 6px;font-size:14px;}
  .icon-btn:hover{color:var(--ink);}
  .ef-section{font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:.04em;margin:14px 0 8px;display:flex;align-items:center;gap:8px;}
  .ef-section .hint{font-weight:400;letter-spacing:0;}
  .ef-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px;margin-bottom:2px;}
  .ef.wide{grid-column:1/-1;}
  .ef label{display:block;font-size:11.5px;color:var(--ink-dim);margin-bottom:4px;}
  .ef input,.ef select,.ef textarea{width:100%;}
  .ef textarea{resize:vertical;line-height:1.5;}
  .ef input:focus,.ef select:focus,.ef textarea:focus,.affix:focus-within{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim);}
  .affix{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;}
  .affix span{padding:0 0 0 10px;font-size:12px;color:var(--ink-dim);}
  .affix input{border:none;background:transparent;box-shadow:none!important;}
  .hint{font-size:11px;color:var(--ink-dim);margin-top:4px;}
  .preview{display:flex;gap:18px;flex-wrap:wrap;background:var(--panel);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:12px;color:var(--ink-dim);}
  .preview b{color:var(--accent);font-size:13.5px;margin-left:4px;}
  .form-err{background:#3d2020;color:#f29a9a;border-radius:6px;padding:7px 10px;font-size:12.5px;margin-top:10px;}
  .editor-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  .editor-actions .spacer{flex:1;}
  .editor-actions .kbd{margin:0 0 0 6px;}
  @media(max-width:640px){.editor-actions .kbd{display:none;}}
  .flash{animation:flashRow 1.4s ease-out;}
  @keyframes flashRow{0%{box-shadow:0 0 0 2px var(--accent);}100%{box-shadow:0 0 0 2px transparent;}}
</style>

<div id="root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = 'clientPortal';

const TYPES = ['static','carousel','reels'];
const TYPE_LABEL = {static:'靜態圖', carousel:'輪播圖', reels:'Reels / 影片'};
const STATUS_LABEL = {Scheduled:'排程中', Launched:'已上線', Ended:'已結束', BudgetExhausted:'預算已用盡'};
const OBJECTIVES = {
  Awareness:    { label:'觸及 / 知名度', resultLabel:'觸及人次',   costLabel:'CPM（每千次觸及）' },
  Traffic:      { label:'流量',         resultLabel:'連結點擊',   costLabel:'CPC（每次點擊成本）' },
  Engagement:   { label:'互動',         resultLabel:'互動次數',   costLabel:'每次互動成本' },
  Leads:        { label:'潛在客戶',      resultLabel:'名單數',    costLabel:'每個名單成本' },
  Sales:        { label:'轉換 / 銷售',   resultLabel:'轉換次數',   costLabel:'每次轉換成本' },
  AppPromotion: { label:'應用程式推廣',   resultLabel:'安裝次數',   costLabel:'每次安裝成本' }
};
// Leads campaigns can collect leads via an Instant Form OR via a Messenger/WhatsApp/IG
// conversation -- both are the same "Leads" objective in Meta's own model, just a
// different result metric depending on the ad set's conversion destination.
const LEADS_RESULT_TYPES = {
  form:     { resultLabel:'名單數',      costLabel:'每個名單成本' },

/* ---------- targeting change log (auto-detected on ad set edit, shown to admin + client) ---------- */
function splitInterests(s){
  return (s||'').split(/[,，、]/).map(x=>x.trim()).filter(Boolean);
}
function diffTargeting(oldTg, newTg){
  oldTg = oldTg || emptyTargeting();
  newTg = newTg || emptyTargeting();
  const labels = { age:'年齡層', gender:'性別', location:'地區', placement:'版位' };
  const changes = [];
  Object.keys(labels).forEach(f => {
    const from = (oldTg[f]||'').trim(), to = (newTg[f]||'').trim();
    if(from !== to) changes.push({ field:f, label:labels[f], from: from||'—', to: to||'—' });
  });
  const oldInt = splitInterests(oldTg.interests), newInt = splitInterests(newTg.interests);
  if(oldInt.join('|') !== newInt.join('|')){
    const added = newInt.filter(x=>!oldInt.includes(x));
    const removed = oldInt.filter(x=>!newInt.includes(x));
    if(added.length || removed.length) changes.push({ field:'interests', label:'興趣', added, removed });
    else changes.push({ field:'interests', label:'興趣', from: oldTg.interests||'—', to: newTg.interests||'—' });
  }
  return changes;
}
function describeChangeHtml(ch){
  if(ch.added || ch.removed){
    const parts = [];
    if(ch.added && ch.added.length) parts.push('新增「'+ch.added.map(escapeHtml).join('、')+'」');
    if(ch.removed && ch.removed.length) parts.push('移除「'+ch.removed.map(escapeHtml).join('、')+'」');
    return escapeHtml(ch.label)+'：'+parts.join('，');
  }
  return escapeHtml(ch.label)+'：'+escapeHtml(ch.from)+' → '+escapeHtml(ch.to);
}
function renderChangeLog(changeLog, editable, campId, adsetId){
  if(!changeLog || !changeLog.length) return '';
  const entries = changeLog.slice().reverse().map(entry => {
    const items = (entry.changes||[]).map(ch=>`<div>${describeChangeHtml(ch)}</div>`).join('');
    const actions = editable ? `<div class="row-actions">
        <button class="small changelog-del" data-editchange="${campId}|${adsetId}|${entry.id}">編輯</button>
        <button class="small danger changelog-del" data-delchange="${campId}|${adsetId}|${entry.id}">刪除</button>
      </div>` : '';
    return `<div class="changelog-entry"><div class="changelog-entry-head"><b>${escapeHtml(entry.date)}</b>${actions}</div>${items}</div>`;
  }).join('');
  return `<div class="section-h">📝 投放調整紀錄</div><div class="changelog">${entries}</div>`;
}

/* ---------- campaign-level performance insight (shown once per campaign, not per ad set) ---------- */
const CIRCLED_NUMS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
function formatCampaignNotes(notes){
  if(!notes) return { summaryParas: [], recItems: [] };
  const idx = notes.search(/\(1\)/);
  // strip a trailing lead-in phrase like "下次投放建議：" before "(1)" -- it's
  // redundant with our own "💡 下次投放建議" section header below.
  const summaryText = (idx >= 0 ? notes.slice(0, idx) : notes)
    .replace(/[，,。]?\s*(下次)?(投放)?建議\s*[:：]?\s*$/, '')
    .trim();
  const recText = idx >= 0 ? notes.slice(idx).trim() : '';
  const summaryParas = summaryText.split(/(?<=。)/).map(s=>s.trim()).filter(Boolean);
  const recItems = recText ? recText.split(/\(\d+\)\s*/).map(s=>s.trim()).filter(Boolean) : [];
  return { summaryParas, recItems };
}
function renderCampaignInsightBody(c){
  if(!c.notes) return '';
  const { summaryParas, recItems } = formatCampaignNotes(c.notes);
  return `${summaryParas.length ? `<div class="insight-label">📈 成效總結</div><div class="insight-body">${summaryParas.map(p=>`<p class="summary">${escapeHtml(p)}</p>`).join('')}</div>` : ''}
    ${recItems.length ? `<div class="insight-label">💡 下次投放建議</div><div class="insight-body">${recItems.map((p,i)=>`<p>${CIRCLED_NUMS[i]||(i+1)+'.'} ${escapeHtml(p)}</p>`).join('')}</div>` : ''}`;
}

/* ---------- group (campaign,adset) pairs by campaign, ordered active-first then by earliest ad set date ---------- */
function groupAndSortPairs(pairs){
  const order = [];
  const map = new Map();
  pairs.forEach(({c,as}) => {
    if(!map.has(c.id)){ map.set(c.id, {c, adsets:[]}); order.push(c.id); }
    map.get(c.id).adsets.push(as);
  });
  const groups = order.map(id => map.get(id));
  groups.forEach(g => g.adsets.sort((a,b) => (a.startDate||'9999-99-99').localeCompare(b.startDate||'9999-99-99')));
  const isActive = g => g.adsets.some(as => computeAdSetStatus(as) === 'Launched');
  const earliestDate = g => g.adsets.reduce((min,as) => { const d = as.startDate || '9999-99-99'; return d < min ? d : min; }, '9999-99-99');
  groups.sort((g1,g2) => {
    const a1 = isActive(g1) ? 0 : 1, a2 = isActive(g2) ? 0 : 1;
    if(a1 !== a2) return a1 - a2;
    return earliestDate(g1).localeCompare(earliestDate(g2));
  });
  return groups;
}

/* Legacy flat "ads" array (pre Campaign > Ad Set > Ad) -> nested campaigns shape.
   Also migrates quota.<type>.used (a manually-typed running total, no per-post
   detail) into quota.<type>.usedBaseline, and ensures a posts[] log exists —
   "已用" is now computed as usedBaseline + count of posts of that type, so
   pre-existing totals aren't lost even though we don't know which specific
   dates/titles they came from. */
function migrateClientData(data){
  if(!data) return data;
  if(!data.campaigns){
    const legacyAds = data.ads || [];
    data.campaigns = legacyAds.map(a => ({
      id: a.id || uid(),
      name: a.name || '未命名活動',
      objective: 'Traffic',
      notes: '',
      adsets: [{
        id: uid(),
        name: a.name || '未命名廣告組合',
        startDate: a.startDate || '',
        endDate: a.endDate || '',
        budgetHKD: +a.budgetHKD || 0,
        targeting: a.targeting || emptyTargeting(),
        ads: [{
          id: uid(),
          name: a.name || '未命名廣告',
          spendHKD: +a.spendHKD || 0,
          reach: +a.reach || 0,
          clicks: +a.clicks || 0,
          results: +a.clicks || 0,
          notes: a.notes || ''
        }]
      }]
    }));
    delete data.ads;
  }
  if(!Array.isArray(data.posts)) data.posts = [];
  TYPES.forEach(t => {
    const q = data.quota && data.quota[t];
    if(!q) return;
    if(q.usedBaseline === undefined){
      q.usedBaseline = +q.used || 0;
      delete q.used;
    }
  });
  return data;
}

/* ---------- post calendar (shared by admin + public view) ---------- */
function isDraftPost(p){ return p.status === 'draft'; }
function computeUsed(data, type){
  const baseline = +(data.quota?.[type]?.usedBaseline) || 0;
  const logged = (data.posts||[]).filter(p => p.type === type && !isDraftPost(p)).length;
  return baseline + logged;
}
function computeMonthlyHours(posts, year, month){
  const prefix = `${year}-${String(month+1).padStart(2,'0')}`;
  const totals = { static:0, carousel:0, reels:0 };
  (posts||[]).forEach(p => {
    if(p.date && p.date.startsWith(prefix) && totals[p.type] !== undefined) totals[p.type] += +p.hours || 0;
  });
  return totals;
}

const WEEKDAY_LABEL = ['日','一','二','三','四','五','六'];
function renderCalendarGrid(posts, year, month, editable){
  const startOffset = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const postsByDate = {};
  (posts||[]).forEach(p => { (postsByDate[p.date] = postsByDate[p.date]||[]).push(p); });

  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push('<div class="cal-day empty"></div>');
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayPosts = postsByDate[dateStr] || [];
    const pills = dayPosts.map(p =>
      `<div class="cal-post ${p.type}${isDraftPost(p) ? ' cal-post-draft' : ''}"${editable ? ` data-editpost="${p.id}"` : ''} title="${escapeHtml(p.title)}${isDraftPost(p) ? '（草稿）' : ''}">${isDraftPost(p) ? '📝 ' : ''}${escapeHtml(p.title)}</div>`
    ).join('');
    const addBtn = editable ? `<button class="cal-add" data-adddate="${dateStr}" title="加貼文紀錄">＋</button>` : '';
    cells.push(`<div class="cal-day"><div class="cal-daynum">${d}</div>${pills}${addBtn}</div>`);
  }
  return `
    <div class="cal-grid cal-weekdays">${WEEKDAY_LABEL.map(w=>`<div class="cal-weekday">${w}</div>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
  `;
}

/* ---------- month-grouping helper (shared by ads tab admin + public view) ---------- */
function monthsSpanned(startDate, endDate){
  if(!startDate && !endDate) return [];
  const start = startDate ? new Date(startDate+'T00:00:00') : new Date(endDate+'T00:00:00');
  const end = endDate ? new Date(endDate+'T00:00:00') : start;
  const months = [];
  let y = start.getFullYear(), m = start.getMonth();
  const endY = end.getFullYear(), endM = end.getMonth();
  let guard = 0;
  while((y < endY || (y===endY && m<=endM)) && guard < 120){
    months.push(y+'-'+m);
    m++; if(m>11){ m=0; y++; }
    guard++;
  }
  return months;
}
function adsetInMonth(adset, year, month){
  return monthsSpanned(adset.startDate, adset.endDate).includes(year+'-'+month);
}

function renderCampaignGroup(group, isAdmin){

    </div>
    ${collapsed ? '' : `${insightBody}${adsetBlocks}`}
  </div>`;
}

/* ---------- ad set status / ad metrics (shared by admin + public view) ---------- */
function computeAdSetStatus(adset){
  const spend = (adset.ads||[]).reduce((s,a)=>s+(+a.spendHKD||0),0);
  const today = new Date().toISOString().slice(0,10);
  if((+adset.budgetHKD||0) > 0 && spend >= (+adset.budgetHKD||0)) return 'BudgetExhausted';
  if(adset.endDate && today > adset.endDate) return 'Ended';
  if(adset.startDate && today < adset.startDate) return 'Scheduled';
  return 'Launched';
}
function statusPillClass(s){
  if(s==='Launched') return 'status-launched';
  if(s==='Scheduled') return 'status-scheduled';
  if(s==='BudgetExhausted') return 'status-budget';
  return 'status-ended';
}
function adMetrics(ad, objective, resultType){
  const spend = +ad.spendHKD||0, reach = +ad.reach||0, clicks = +ad.clicks||0;
  const ctr = (clicks && reach) ? ((clicks/reach)*100).toFixed(2)+'%' : '—';
  const meta = getResultMeta(objective, resultType);
  let resultValue, costPerResult;
  if(objective === 'Awareness'){
    resultValue = reach;
    costPerResult = reach ? 'HK$' + (spend/reach*1000).toFixed(2) : '—';
  }else{
    resultValue = +ad.results||0;
    costPerResult = resultValue ? 'HK$' + (spend/resultValue).toFixed(2) : '—';
  }
  return { ctr, resultValue, costPerResult, resultLabel: meta.resultLabel, costLabel: meta.costLabel };
}
function adStatGridCells(a, m, objective){
  const spend = `<div>花費<b>HK$${(+a.spendHKD||0).toLocaleString()}</b></div>`;
  const clicks = `<div>點擊<b>${(+a.clicks||0).toLocaleString()}</b></div>`;
  const ctr = `<div>CTR<b>${m.ctr}</b></div>`;
  if(objective === 'Awareness'){
    const reach = `<div>觸及<b>${(+a.reach||0).toLocaleString()}</b></div>`;
    return spend + reach + clicks + ctr;
  }
  const result = `<div>${escapeHtml(m.resultLabel)}<b>${m.resultValue.toLocaleString()}</b></div>`;
  return spend + result + clicks + ctr;
}

/* ================= CLIENT (READ-ONLY, PUBLIC) VIEW ================= */
async function renderClientView(){
  const root = document.getElementById('root');
  if(!clientViewId){
    root.innerHTML = '<div class="wrap"><div class="empty">連結無效，缺少客戶編號。</div></div>';
    return;
  }
  const data = await loadClient(clientViewId);
  if(!data){
    root.innerHTML = '<div class="wrap"><div class="empty">找不到相關客戶資料，連結可能已失效。</div></div>';
    return;
  }
  const quotaCards = TYPES.map(t=>{
    const q = data.quota[t];
    const used = computeUsed(data, t);
    const remaining = q.signed - used;
    const pct = q.signed>0 ? Math.min(100,(used/q.signed)*100) : 0;
    return `<div class="quota-card">
      <div class="label">${TYPE_LABEL[t]}</div>
      <div class="nums">${remaining} <span>剩餘 / 共 ${q.signed}</span></div>
      <div class="bar ${remaining<0?'over':''}"><div style="width:${pct}%"></div></div>
      <div class="totals">已使用 ${used} / 已簽 ${q.signed}</div>
    </div>`;
  }).join('');

  if(calYear === null){ const now = new Date(); calYear = now.getFullYear(); calMonth = now.getMonth(); }

  const campaigns = data.campaigns || [];
  if(adsYear === null){ const now = new Date(); adsYear = now.getFullYear(); adsMonth = now.getMonth(); }
  const allPairs = [];
  campaigns.forEach(c => (c.adsets||[]).forEach(as => allPairs.push({ c, as })));
  const thisMonthPairs = allPairs.filter(({as}) => adsetInMonth(as, adsYear, adsMonth));
  const thisMonthGroups = groupAndSortPairs(thisMonthPairs);
  const campaignCards = thisMonthGroups.length
    ? thisMonthGroups.map(g => renderCampaignGroup(g, false)).join('')
    : '<div class="empty">呢個月暫時未有廣告投放記錄。</div>';

  root.innerHTML = `
    <div class="wrap">
      <img class="brand-logo" src="logo.png" alt="">
      <h1>${escapeHtml(data.name)} — 貼文與廣告進度</h1>
      <p class="sub">最後更新資料由服務方提供，僅供參考</p>
      <div class="panel">
        <div class="section-label" style="margin-top:0">貼文名額</div>
        <div class="grid3">${quotaCards}</div>
      </div>
      <div class="panel">
        <div class="cal-head">
          <button class="small" id="calPrevBtn">‹</button>
          <div class="cal-title">${calYear}年${calMonth+1}月</div>
          <button class="small" id="calNextBtn">›</button>
        </div>
        ${renderCalendarGrid((data.posts||[]).filter(p => !isDraftPost(p)), calYear, calMonth, false)}
        <div class="cal-legend">
          ${TYPES.map(t=>`<span class="cal-legend-item"><span class="cal-dot ${t}"></span>${TYPE_LABEL[t]}</span>`).join('')}
        </div>
      </div>
      <div class="cal-head">
        <button class="small" id="adsPrevBtn">‹</button>
        <div class="cal-title">${adsYear}年${adsMonth+1}月嘅Meta廣告投放</div>
        <button class="small" id="adsNextBtn">›</button>
      </div>
      ${campaignCards}
    </div>
  `;
  document.getElementById('calPrevBtn').addEventListener('click', () => { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderClientView(); });
  document.getElementById('calNextBtn').addEventListener('click', () => { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderClientView(); });
  document.getElementById('adsPrevBtn').addEventListener('click', () => { adsMonth--; if(adsMonth<0){adsMonth=11;adsYear--;} renderClientView(); });
  document.getElementById('adsNextBtn').addEventListener('click', () => { adsMonth++; if(adsMonth>11){adsMonth=0;adsYear++;} renderClientView(); });
  bindCollapseToggles(root, renderClientView);
}

        <button id="newClientBtn">＋ 新增客戶</button>
        <button id="renameClientBtn">重新命名</button>
        <button id="deleteClientBtn" class="danger">刪除</button>
        <button id="shareBtn">分享客戶連結</button>
        <button id="metaAcctBtn">設定Meta廣告帳戶ID</button>
      </div>
      <div id="shareBoxHolder"></div>
      <div id="app" style="display:none">
        <div class="tabs">
          <div class="tab active" data-tab="quota">貼文名額</div>
          <div class="tab" data-tab="ads">Meta 廣告</div>
          <div class="tab" data-tab="sync">匯入 / 匯出</div>
        </div>
        <div id="tab-quota" class="tabpanel"></div>
        <div id="tab-ads" class="tabpanel" style="display:none"></div>
        <div id="tab-sync" class="tabpanel" style="display:none"></div>
      </div>
      <div id="noClient" class="empty">未有客戶資料，請按「＋ 新增客戶」開始。</div>
    </div>
  `;

  document.getElementById('clientSelect').addEventListener('change', e => selectClient(e.target.value));
  document.getElementById('newClientBtn').addEventListener('click', async () => {
    const name = prompt('客戶名稱：');
    if(!name) return;
    const id = uid();
    clients.push({id, name});
    await saveIndex();
    await saveClient(id, emptyClientData(name));
    await selectClient(id);
  });
  document.getElementById('renameClientBtn').addEventListener('click', async () => {
    if(!currentId) return;
    const name = prompt('新名稱：', currentData.name);
    if(!name) return;
    currentData.name = name;
    const c = clients.find(c=>c.id===currentId);
    if(c) c.name = name;
    await saveIndex();
    await saveClient(currentId, currentData);
    await selectClient(currentId);
  });
  document.getElementById('deleteClientBtn').addEventListener('click', async () => {
    if(!currentId) return;
    if(!confirm(`確定刪除客戶「${currentData.name}」？此動作無法還原。`)) return;
    await deleteClientStorage(currentId);
    clients = clients.filter(c => c.id !== currentId);
    await saveIndex();
    currentId = null; currentData = null;
    if(clients.length) await selectClient(clients[0].id);
    else {
      document.getElementById('app').style.display = 'none';
      document.getElementById('noClient').style.display = 'block';
      document.getElementById('subhead').textContent = '未有客戶資料。';
    }
  });
  document.getElementById('metaAcctBtn').addEventListener('click', async () => {
    if(!currentId) return;
    const v = prompt(`「${currentData.name}」嘅Meta廣告帳戶ID（例如 act_1234567890，喺Meta Ads Manager網址或「帳戶概覽」度搵到）：`, currentData.metaAdAccountId || '');
    if(v === null) return;
    currentData.metaAdAccountId = v.trim();
    await saveClient(currentId, currentData);
    document.getElementById('subhead').textContent = subheadText(currentData);
  });
  document.getElementById('shareBtn').addEventListener('click', () => {
    if(!currentId) return;
    const base = location.origin + location.pathname;
    const link = base + '?view=client&id=' + currentId;
    const holder = document.getElementById('shareBoxHolder');
    holder.innerHTML = `<div class="panel"><div class="sharebox">
      <input id="shareLinkInput" readonly value="${escapeHtml(link)}">
      <button id="copyShareBtn">複製連結</button>
    </div><p style="font-size:11.5px;color:var(--ink-dim);margin:8px 0 0">呢個連結只顯示「${escapeHtml(currentData.name)}」嘅資料，可以直接畀客戶睇（唔會見到其他客戶）。</p></div>`;
    document.getElementById('shareLinkInput').select();
    document.getElementById('copyShareBtn').addEventListener('click', () => {
      const inp = document.getElementById('shareLinkInput');
      inp.select();
      try{ navigator.clipboard.writeText(inp.value); }catch(e){ document.execCommand('copy'); }
    });
  });
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.querySelectorAll('.tabpanel').forEach(p=>p.style.display='none');
      document.getElementById('tab-'+t.dataset.tab).style.display='block';
    });
  });
}

function renderClientSelect(){
  const sel = document.getElementById('clientSelect');
  sel.innerHTML = clients.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  if(currentId) sel.value = currentId;
}

async function selectClient(id){
  currentId = id;
  currentData = await loadClient(id);
  if(!currentData){
    currentData = emptyClientData(clients.find(c=>c.id===id)?.name || '未命名客戶');
  }
  await saveClient(id, currentData); // persists first-time creation or, for legacy clients, the migrated campaigns shape
  document.getElementById('shareBoxHolder').innerHTML = '';
  adsEdit = null;
  document.getElementById('app').style.display = clients.length ? 'block' : 'none';
  document.getElementById('noClient').style.display = clients.length ? 'none' : 'block';
  document.getElementById('subhead').textContent = clients.length ? subheadText(currentData) : '未有客戶資料。';
  renderClientSelect();
  renderQuotaTab();
  renderAdsTab();
  renderSyncTab();
}

async function initAdmin(){
  adminShell();
  clients = await loadIndex();
  renderClientSelect();
  if(clients.length){ await selectClient(clients[0].id); }
  else{
    document.getElementById('app').style.display = 'none';
    document.getElementById('noClient').style.display = 'block';
    document.getElementById('subhead').textContent = '未有客戶資料。';
  }
}

/* ---------- QUOTA TAB (+ post delivery calendar) ---------- */
function renderQuotaTab(){
  const el = document.getElementById('tab-quota');
  const cards = TYPES.map(t => {
    const q = currentData.quota[t];
    const used = computeUsed(currentData, t);
    const remaining = q.signed - used;
    const pct = q.signed > 0 ? Math.min(100, (used/q.signed)*100) : 0;
    const over = remaining < 0;
    return `
      <div class="quota-card">
        <div class="label">${TYPE_LABEL[t]}</div>
        <div class="nums">${remaining} <span>剩餘 / 共 ${q.signed}</span></div>
        <div class="bar ${over?'over':''}"><div style="width:${pct}%"></div></div>
        <div class="totals">已使用 ${used} / 已簽 ${q.signed}</div>
        <div class="qctrl">
          <span style="font-size:11px;color:var(--ink-dim)">已簽</span>
          <input type="number" min="0" value="${q.signed}" data-type="${t}" data-field="signed">
        </div>
      </div>`;
  }).join('');

  if(calYear === null){ const now = new Date(); calYear = now.getFullYear(); calMonth = now.getMonth(); }
  const hoursTotals = computeMonthlyHours(currentData.posts, calYear, calMonth);
  const hoursSum = TYPES.reduce((s,t)=>s+hoursTotals[t],0);

  el.innerHTML = `
    <div class="panel"><div class="grid3">${cards}</div></div>
    <div class="panel">
      <div class="cal-head">
        <button class="small" id="calPrevBtn">‹</button>
        <div class="cal-title">${calYear}年${calMonth+1}月</div>
        <button class="small" id="calNextBtn">›</button>
      </div>
      <p style="font-size:11.5px;color:var(--ink-dim);margin:6px 0 10px">貼文交付日曆：撳日格入面嘅「＋」加一條紀錄（標題＋類型），「已用」會自動計返出嚟。草稿（📝）唔算入已用quota，客戶都睇唔到。</p>
      ${renderCalendarGrid(currentData.posts, calYear, calMonth, true)}
      <div class="cal-legend">
        ${TYPES.map(t=>`<span class="cal-legend-item"><span class="cal-dot ${t}"></span>${TYPE_LABEL[t]}</span>`).join('')}
      </div>
      <div class="section-label">本月花咗嘅時數（淨係你自己睇到）</div>
      <div class="hours-summary">
        ${TYPES.map(t=>`<span class="hours-stat">${TYPE_LABEL[t]}：<b>${hoursTotals[t]}</b> 小時</span>`).join('')}
        <span class="hours-stat">合計：<b>${hoursSum}</b> 小時</span>
      </div>
    </div>
    <div id="postFormHolder"></div>
  `;
  el.querySelectorAll('.quota-card input').forEach(inp => {
    inp.addEventListener('change', async () => {
      const t = inp.dataset.type, f = inp.dataset.field;
      currentData.quota[t][f] = Math.max(0, parseInt(inp.value)||0);
      await saveClient(currentId, currentData);
      renderQuotaTab();
    });
  });
  document.getElementById('calPrevBtn').addEventListener('click', () => { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderQuotaTab(); });
  document.getElementById('calNextBtn').addEventListener('click', () => { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderQuotaTab(); });
  wireCalendarEvents(el);
}

function wireCalendarEvents(el){
  el.querySelectorAll('[data-adddate]').forEach(b => b.addEventListener('click', () => showPostForm(b.dataset.adddate, null)));
  el.querySelectorAll('[data-editpost]').forEach(b => b.addEventListener('click', () => {
    const post = currentData.posts.find(p => p.id === b.dataset.editpost);
    if(post) showPostForm(post.date, post.id);
  }));
}

function showPostForm(dateStr, postId){
  currentData.posts = currentData.posts || [];
  const post = postId ? currentData.posts.find(p=>p.id===postId) : { id: uid(), date: dateStr, type: 'static', title: '', hours: 0, status: 'delivered' };
  const holder = document.getElementById('postFormHolder');
  holder.innerHTML = `
    <div class="panel">
      <div class="section-label" style="margin-top:0">貼文交付紀錄</div>
      <div class="field-row">
        <div><label>日期</label><input type="date" id="f_post_date" value="${post.date}"></div>
        <div><label>類型</label>
          <select id="f_post_type">
            ${TYPES.map(t=>`<option value="${t}" ${post.type===t?'selected':''}>${TYPE_LABEL[t]}</option>`).join('')}
          </select>
        </div>
        <div><label>花咗嘅時數</label><input type="number" min="0" step="0.5" id="f_post_hours" value="${post.hours||0}"></div>
        <div><label>狀態</label>
          <select id="f_post_status">
            <option value="delivered" ${(post.status||'delivered')==='delivered'?'selected':''}>已發佈</option>
            <option value="draft" ${post.status==='draft'?'selected':''}>草稿（未出街，客戶睇唔到）</option>
          </select>
        </div>
      </div>
      <div style="margin-bottom:8px">
        <label style="font-size:11px;color:var(--ink-dim)">標題</label>
        <input id="f_post_title" style="width:100%" placeholder="例：8月品牌故事輪播圖" value="${escapeHtml(post.title)}">
      </div>
      <p class="admin-only-note">時數同狀態淨係你自己(admin)睇到；草稿狀態嘅貼文唔會計入「已用」quota，客戶公開頁面都唔會顯示。</p>
      <div class="footer-actions">
        <button class="primary" id="savePostBtn">儲存</button>
        <button id="cancelPostBtn">取消</button>
        ${postId ? '<button class="danger" id="delPostBtn">刪除</button>' : ''}
      </div>
    </div>
  `;
  document.getElementById('cancelPostBtn').addEventListener('click', () => holder.innerHTML='');
  document.getElementById('savePostBtn').addEventListener('click', async () => {
    post.date = document.getElementById('f_post_date').value || dateStr;
    post.type = document.getElementById('f_post_type').value;
    post.hours = +document.getElementById('f_post_hours').value || 0;
    post.status = document.getElementById('f_post_status').value;
    post.title = document.getElementById('f_post_title').value.trim() || '未命名貼文';
    const idx = currentData.posts.findIndex(p=>p.id===post.id);
    if(idx>=0) currentData.posts[idx]=post; else currentData.posts.push(post);
    await saveClient(currentId, currentData);
    holder.innerHTML='';
    renderQuotaTab();
  });
  const delBtn = document.getElementById('delPostBtn');
  if(delBtn) delBtn.addEventListener('click', async () => {
    if(!confirm('確定刪除呢條貼文紀錄？')) return;
    currentData.posts = currentData.posts.filter(p=>p.id!==post.id);
    await saveClient(currentId, currentData);
    holder.innerHTML='';
    renderQuotaTab();
  });
}

/* ---------- ADS TAB (admin): month view, compact rows, inline editors ---------- */
// Only one editor is open at a time. adsEdit = { kind:'campaign'|'adset'|'ad'|'change', isNew, campId, adsetId, id, draft }
// `draft` is the real object when editing an existing item (only mutated on save) or a fresh object when adding.
let adsEdit = null;
const adsOpenDetails = new Set();   // ad set ids whose targeting + change log are expanded
const adsOpenInsights = new Set();  // campaign ids whose performance summary is expanded
let adsFlashId = null;              // id of the row just saved, briefly highlighted after re-render

function fmtHKD(n){ return 'HK$' + (+n||0).toLocaleString(); }
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtShortDate(d){
  if(!d) return '—';
  const [y,m,day] = d.split('-');
  return (+y !== adsYear ? y.slice(2)+'/' : '') + (+m) + '/' + (+day);
}
function monthRange(y, m){
  return [`${y}-${pad2(m+1)}-01`, `${y}-${pad2(m+1)}-${pad2(new Date(y, m+1, 0).getDate())}`];
}
function findCamp(id){ return (currentData.campaigns||[]).find(c => c.id === id); }
function findAdset(cid, asid){ const c = findCamp(cid); return c && (c.adsets||[]).find(a => a.id === asid); }
function adsetTotals(c, as){
  const t = (as.ads||[]).reduce((s,a) => ({
    spend: s.spend + (+a.spendHKD||0), reach: s.reach + (+a.reach||0),
    clicks: s.clicks + (+a.clicks||0), results: s.results + (+a.results||0)
  }), {spend:0, reach:0, clicks:0, results:0});
  const m = adMetrics({spendHKD:t.spend, reach:t.reach, clicks:t.clicks, results:t.results}, c.objective, as.resultType);
  return Object.assign({}, t, m);
}
const isEditing = (kind, id) => !!adsEdit && adsEdit.kind === kind && !adsEdit.isNew && adsEdit.id === id;
const isAdding = (kind, key, val) => !!adsEdit && adsEdit.kind === kind && adsEdit.isNew && adsEdit[key] === val;

function renderAdsTab(){
  const el = document.getElementById('tab-ads');
  const campaigns = currentData.campaigns || [];
  if(adsYear === null){ const now = new Date(); adsYear = now.getFullYear(); adsMonth = now.getMonth(); }
  wireAdsTabEvents(el);

  const allPairs = [];
  campaigns.forEach(c => (c.adsets||[]).forEach(as => allPairs.push({ c, as })));
  const monthPairs = allPairs.filter(({as}) => adsetInMonth(as, adsYear, adsMonth));
  const monthGroups = groupAndSortPairs(monthPairs);
  const undatedGroups = groupAndSortPairs(allPairs.filter(({as}) => !as.startDate && !as.endDate));
  const seen = new Set(undatedGroups.map(g => g.c.id));
  campaigns.filter(c => !(c.adsets||[]).length && !seen.has(c.id)).forEach(c => undatedGroups.push({ c, adsets: [] }));

  // how many ad sets touch each month of the selected year (drives the month pills)
  const counts = Array(12).fill(0);
  allPairs.forEach(({as}) => monthsSpanned(as.startDate, as.endDate).forEach(k => {
    const [y, m] = k.split('-'); if(+y === adsYear) counts[+m]++;
  }));
  const now = new Date();

  let budget = 0, spend = 0, adCount = 0;
  monthPairs.forEach(({as}) => {
    budget += +as.budgetHKD||0;
    (as.ads||[]).forEach(a => { spend += +a.spendHKD||0; adCount++; });
  });

  el.innerHTML = `
    <div class="ads-toolbar">
      <div class="year-nav">
        <button class="small" data-act="year-prev" aria-label="上一年">‹</button>
        <span class="year-label">${adsYear}年</span>
        <button class="small" data-act="year-next" aria-label="下一年">›</button>
        <button class="small" data-act="today">今個月</button>
      </div>
      <button class="primary" data-act="new-camp">＋ 新增 Campaign</button>
    </div>
    <div class="month-pills">
      ${counts.map((n, m) => `<button class="month-pill${m===adsMonth?' active':''}${(adsYear===now.getFullYear()&&m===now.getMonth())?' cur':''}" data-act="month" data-m="${m}">${m+1}月${n ? `<i>${n}</i>` : ''}</button>`).join('')}
    </div>
    ${adsEdit && adsEdit.kind==='campaign' && adsEdit.isNew ? renderCampaignEditor() : ''}
    <div class="ads-summary">
      <div class="sum-tile"><div class="k">${adsMonth+1}月 廣告組合</div><div class="v">${monthPairs.length}</div></div>
      <div class="sum-tile"><div class="k">廣告數量</div><div class="v">${adCount}</div></div>
      <div class="sum-tile"><div class="k">預算</div><div class="v">${fmtHKD(budget)}</div></div>
      <div class="sum-tile"><div class="k">花費</div><div class="v">${fmtHKD(spend)}${budget>0 ? `<span>${Math.round(spend/budget*100)}%</span>` : ''}</div></div>
    </div>
    ${monthGroups.length ? monthGroups.map(renderAdminCampaign).join('') : `<div class="empty">${adsYear}年${adsMonth+1}月未有廣告投放。揀其他月份，或按「＋ 新增 Campaign」。</div>`}
    ${undatedGroups.length ? `<div class="section-label" style="margin-top:22px">未定日期 / 未有廣告組合</div>${undatedGroups.map(renderAdminCampaign).join('')}` : ''}
  `;
  if(adsFlashId){
    const f = el.querySelector(`[data-flash-id="${adsFlashId}"]`);
    if(f) f.classList.add('flash');
    adsFlashId = null;
  }
  if(adsEdit && adsEdit.kind === 'ad') updateAdPreview();
}

function renderAdminCampaign(g){
  const c = g.c;
  const obj = OBJECTIVES[c.objective] || OBJECTIVES.Traffic;
  const insightOpen = adsOpenInsights.has(c.id);
  const adding = isAdding('adset', 'campId', c.id);
  return `<div class="camp-card" data-flash-id="${c.id}">
    <div class="camp-head">
      <div class="camp-title"><span class="camp-name">${escapeHtml(c.name)}</span><span class="obj-pill">${obj.label}</span></div>
      <div class="row-actions">
        <button class="small" data-act="add-adset" data-c="${c.id}">＋ 廣告組合</button>
        <button class="small" data-act="edit-camp" data-c="${c.id}">✎ 編輯</button>
      </div>
    </div>
    ${c.notes ? `<button class="link-btn" data-act="toggle-insight" data-c="${c.id}">${insightOpen ? '▾' : '▸'} 📈 成效總結與建議</button>
      ${insightOpen ? `<div class="insight-wrap">${renderCampaignInsightBody(c)}</div>` : ''}` : ''}
    ${isEditing('campaign', c.id) ? renderCampaignEditor() : ''}
    ${g.adsets.map(as => renderAdminAdset(c, as)).join('')}
    ${!g.adsets.length && !adding ? '<div class="empty slim">未有廣告組合，按「＋ 廣告組合」開始。</div>' : ''}
    ${adding ? renderAdsetEditor() : ''}
  </div>`;
}

function renderAdminAdset(c, as){
  const status = computeAdSetStatus(as);
  const tot = adsetTotals(c, as);
  const budget = +as.budgetHKD || 0;
  const pct = budget > 0 ? Math.min(100, tot.spend / budget * 100) : 0;
  const open = adsOpenDetails.has(as.id);
  const tg = as.targeting || {};
  const chips = [
    tg.age ? `<span class="chip">👤 ${escapeHtml(tg.age)}</span>` : '',
    tg.gender ? `<span class="chip">${escapeHtml(tg.gender)}</span>` : '',
    tg.location ? `<span class="chip">📍 ${escapeHtml(tg.location)}</span>` : '',
    tg.placement ? `<span class="chip">📲 ${escapeHtml(tg.placement)}</span>` : ''
  ].filter(Boolean).join('');
  const interestChips = splitInterests(tg.interests).map(x => `<span class="chip dim">${escapeHtml(x)}</span>`).join('');
  const details = open ? `<div class="as-details">
      <div class="section-h" style="margin-top:0">🎯 目標受眾</div>
      ${chips || interestChips ? `<div class="chips">${chips}</div>${interestChips ? `<div class="chips interest-chips">${interestChips}</div>` : ''}` : '<div class="hint">未有受眾設定，按「✎ 編輯組合」填寫。</div>'}
      ${renderAdminChangeLog(c, as)}
    </div>` : '';
  return `<div class="as-card" data-flash-id="${as.id}">
    <div class="as-head" data-act="toggle-details" data-a="${as.id}" title="展開 / 收起受眾同調整紀錄">
      <div class="as-title">
        <span class="chev">${open ? '▾' : '▸'}</span>
        <span class="as-name">${escapeHtml(as.name)}</span>
        <span class="status-pill ${statusPillClass(status)}">${STATUS_LABEL[status]}</span>
      </div>
      <button class="small" data-act="edit-adset" data-c="${c.id}" data-a="${as.id}">✎ 編輯組合</button>
    </div>
    <div class="as-stats">
      <div class="as-stat"><div class="k">📅 投放期間</div><div class="v">${fmtShortDate(as.startDate)} – ${fmtShortDate(as.endDate)}</div></div>
      <div class="as-stat"><div class="k">花費 / 預算</div><div class="v">${fmtHKD(tot.spend)}${budget ? `<span> / ${fmtHKD(budget)}</span>` : ''}</div>
        ${budget ? `<div class="bar mini${tot.spend > budget ? ' over' : ''}"><div style="width:${pct}%"></div></div>` : ''}</div>
      <div class="as-stat"><div class="k">${escapeHtml(tot.resultLabel)}</div><div class="v">${tot.resultValue.toLocaleString()}</div></div>
      <div class="as-stat"><div class="k">${escapeHtml(tot.costLabel)}</div><div class="v accent">${tot.costPerResult}</div></div>
      <div class="as-stat"><div class="k">CTR</div><div class="v">${tot.ctr}</div></div>
    </div>
    ${isEditing('adset', as.id) ? renderAdsetEditor() : ''}
    ${details}
    ${renderAdminAds(c, as)}
  </div>`;
}

function renderAdminAds(c, as){
  const ads = as.ads || [];
  const rows = ads.map(a => {
    const m = adMetrics(a, c.objective, as.resultType);
    const editing = isEditing('ad', a.id);
    return `<div class="ad-row${editing ? ' editing' : ''}" data-act="edit-ad" data-c="${c.id}" data-a="${as.id}" data-ad="${a.id}" data-flash-id="${a.id}" tabindex="0" role="button" aria-expanded="${editing}">
        <div class="c name" title="${escapeHtml(a.name)}">${escapeHtml(a.name)}</div>
        <div class="c" data-l="花費">${fmtHKD(a.spendHKD)}</div>
        <div class="c" data-l="${escapeHtml(m.resultLabel)}">${m.resultValue.toLocaleString()}</div>
        <div class="c" data-l="單次成本">${m.costPerResult}</div>
        <div class="c" data-l="CTR">${m.ctr}</div>
        <div class="c go">${editing ? '▾' : '✎'}</div>

function editorError(msg){
  const e = document.getElementById('editorErr');

async function saveEditor(){
  if(!adsEdit) return;
  const v = id => (document.getElementById(id) || {}).value || '';
  const e = adsEdit, d = e.draft;
  let flashId = d.id;
  if(e.kind === 'campaign'){
    d.name = v('f_camp_name').trim() || '未命名活動';
    d.objective = v('f_camp_obj');
    d.notes = v('f_camp_notes').trim();
    d.adsets = d.adsets || [];
    if(e.isNew) currentData.campaigns.push(d);
  }else if(e.kind === 'adset'){
    const start = v('f_as_start'), end = v('f_as_end');
    if(start && end && end < start) return editorError('結束日期唔可以早過開始日期。');
    const camp = findCamp(e.campId);
    const newTg = { age: v('f_as_age'), gender: v('f_as_gender'), location: v('f_as_location'), placement: v('f_as_placement'), interests: v('f_as_interests') };
    d.name = v('f_as_name').trim() || '未命名組合';
    d.startDate = start; d.endDate = end;
    d.budgetHKD = +v('f_as_budget') || 0;
    if(camp.objective === 'Leads') d.resultType = v('f_as_resulttype');
    d.ads = d.ads || [];
    if(!e.isNew){
      const changes = diffTargeting(d.targeting, newTg);
      if(changes.length){
        d.changeLog = d.changeLog || [];
        d.changeLog.push({ id: uid(), date: new Date().toISOString().slice(0,10), changes });
      }
    }
    d.targeting = newTg;
    if(e.isNew) camp.adsets.push(d);
    // follow the ad set to its month so it doesn't "disappear" after saving
    if((start || end) && !adsetInMonth(d, adsYear, adsMonth)){
      const t = new Date((start || end) + 'T00:00:00'); adsYear = t.getFullYear(); adsMonth = t.getMonth();
    }
  }else if(e.kind === 'ad'){
    const camp = findCamp(e.campId), as = findAdset(e.campId, e.adsetId);
    d.name = v('f_ad_name').trim() || '未命名廣告';
    d.spendHKD = +v('f_ad_spend') || 0;
    d.reach = +v('f_ad_reach') || 0;
    d.clicks = +v('f_ad_clicks') || 0;
    d.results = camp.objective === 'Awareness' ? d.reach : (+v('f_ad_results') || 0);
    d.notes = v('f_ad_notes').trim();
    as.ads = as.ads || [];
    if(e.isNew) as.ads.push(d);
  }else if(e.kind === 'change'){
    d.date = v('f_chg_date') || d.date;
    d.changes = (d.changes||[]).map((ch, i) => (ch.added || ch.removed)
      ? { field: ch.field, label: ch.label, added: splitInterests(v(`f_chg_${i}_added`)), removed: splitInterests(v(`f_chg_${i}_removed`)) }
      : { field: ch.field, label: ch.label, from: v(`f_chg_${i}_from`).trim() || '—', to: v(`f_chg_${i}_to`).trim() || '—' });
  }
  const btn = document.querySelector('#adsEditor [data-act="save"]');
  if(btn){ btn.disabled = true; btn.textContent = '儲存中…'; }
  try{
    await saveClient(currentId, currentData);
  }catch(err){
    if(btn){ btn.disabled = false; btn.textContent = '儲存'; }
    return editorError('儲存失敗，請檢查網絡後再試。');
  }
  adsEdit = null;
  adsFlashId = flashId;
  renderAdsTab();
}

async function deleteEditorTarget(){
  if(!adsEdit || adsEdit.isNew) return;
  const e = adsEdit;
  if(e.kind === 'campaign'){
    if(!confirm('確定刪除呢個行銷活動？入面所有廣告組合同廣告都會一齊刪除。')) return;
    currentData.campaigns = currentData.campaigns.filter(c => c.id !== e.id);
  }else if(e.kind === 'adset'){
    if(!confirm('確定刪除呢個廣告組合？入面所有廣告都會一齊刪除。')) return;
    const camp = findCamp(e.campId); camp.adsets = camp.adsets.filter(a => a.id !== e.id);
  }else if(e.kind === 'ad'){
    if(!confirm('確定刪除呢個廣告？')) return;
    const as = findAdset(e.campId, e.adsetId); as.ads = as.ads.filter(a => a.id !== e.id);
  }else if(e.kind === 'change'){
    if(!confirm('確定刪除呢條調整紀錄？客戶頁面都會同步移除。')) return;
    const as = findAdset(e.campId, e.adsetId); as.changeLog = (as.changeLog||[]).filter(x => x.id !== e.id);
  }
  await saveClient(currentId, currentData);
  adsEdit = null;
  renderAdsTab();
}

/* ----- collapse/expand toggles for campaign/adset/ad cards (public client view only now) ----- */
function bindCollapseToggles(el, rerender){
  el.querySelectorAll('[data-toggle-campaign]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.toggleCampaign;
    if(collapsedCampaigns.has(id)) collapsedCampaigns.delete(id); else collapsedCampaigns.add(id);
    rerender();
  }));
  el.querySelectorAll('[data-toggle-adset]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.toggleAdset;
    if(collapsedAdsets.has(id)) collapsedAdsets.delete(id); else collapsedAdsets.add(id);
    rerender();
  }));
  el.querySelectorAll('[data-toggle-ad]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.toggleAd;
    if(collapsedAds.has(id)) collapsedAds.delete(id); else collapsedAds.add(id);
    rerender();
  }));
}

/* ----- one delegated listener set for the whole tab (attached once; innerHTML is re-rendered freely) ----- */
function wireAdsTabEvents(el){
  if(el.dataset.wired) return;
  el.dataset.wired = '1';
  el.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if(!t || !el.contains(t)) return;
    const act = t.dataset.act, c = t.dataset.c, a = t.dataset.a, ad = t.dataset.ad, id = t.dataset.id;
    if(act === 'year-prev'){ adsYear--; adsEdit = null; return renderAdsTab(); }
    if(act === 'year-next'){ adsYear++; adsEdit = null; return renderAdsTab(); }
    if(act === 'today'){ const n = new Date(); adsYear = n.getFullYear(); adsMonth = n.getMonth(); adsEdit = null; return renderAdsTab(); }
    if(act === 'month'){ adsMonth = +t.dataset.m; adsEdit = null; return renderAdsTab(); }
    if(act === 'toggle-details'){
      if(adsOpenDetails.has(a)) adsOpenDetails.delete(a); else adsOpenDetails.add(a);
      return renderAdsTab();
    }
    if(act === 'toggle-insight'){
      if(adsOpenInsights.has(c)) adsOpenInsights.delete(c); else adsOpenInsights.add(c);
      return renderAdsTab();
    }
    if(act === 'cancel') return closeEditor();
    if(act === 'save') return saveEditor();
    if(act === 'delete') return deleteEditorTarget();
    if(act === 'new-camp') return openEditor({ kind:'campaign', isNew:true, id:uid(), draft:{ id:uid(), name:'', objective:'Traffic', notes:'', adsets:[] } });
    if(act === 'edit-camp'){
      if(isEditing('campaign', c)) return closeEditor();
      return openEditor({ kind:'campaign', id:c, draft:findCamp(c) });
    }
    if(act === 'add-adset'){
      const [s, en] = monthRange(adsYear, adsMonth);
      return openEditor({ kind:'adset', isNew:true, campId:c, draft:{ id:uid(), name:'', startDate:s, endDate:en, budgetHKD:0, targeting:emptyTargeting(), resultType:'form', ads:[] } });
    }
    if(act === 'edit-adset'){
      if(isEditing('adset', a)) return closeEditor();
      return openEditor({ kind:'adset', campId:c, id:a, draft:findAdset(c, a) });
    }
    if(act === 'add-ad') return openEditor({ kind:'ad', isNew:true, campId:c, adsetId:a, draft:{ id:uid(), name:'', spendHKD:0, reach:0, clicks:0, results:0, notes:'' } });
    if(act === 'edit-ad'){
      if(isEditing('ad', ad)) return closeEditor();
      return openEditor({ kind:'ad', campId:c, adsetId:a, id:ad, draft:findAdset(c, a).ads.find(x => x.id === ad) });
    }
    if(act === 'edit-change'){
      if(isEditing('change', id)) return closeEditor();
      return openEditor({ kind:'change', campId:c, adsetId:a, id, draft:findAdset(c, a).changeLog.find(x => x.id === id) });
    }
  });
  el.addEventListener('input', e => {
    if(adsEdit && adsEdit.kind === 'ad' && e.target.closest('#adsEditor')) updateAdPreview();
  });
  el.addEventListener('keydown', e => {
    const row = e.target.closest && e.target.closest('.ad-row[role="button"]');
    if(row && e.target === row && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); row.click(); return; }
    if(!adsEdit || !e.target.closest || !e.target.closest('#adsEditor')) return;
    if(e.key === 'Escape'){ e.preventDefault(); closeEditor(); }
    else if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON'){ e.preventDefault(); saveEditor(); }
    else if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); saveEditor(); }
  });
}

      <p style="font-size:12px;color:var(--ink-dim)">
        <b>quota.usedBaseline</b>係「已用」嘅起始底數（一般keep 0就得）；實際「已用」會自動 = usedBaseline + 呢個月曆入面status為delivered嘅同類型posts數量（draft唔計），唔使自己計。<br>
        <b>posts</b>係貼文交付日曆嘅紀錄，type要係 static/carousel/reels 其中一個；hours係淨係admin睇到嘅工時記錄；status係 delivered（已發佈）或 draft（草稿，唔計quota、客戶頁面唔顯示，用嚟預先佔位下個月嘅計劃）。<br>
        <b>adsets.changeLog</b>係「投放調整紀錄」，喺admin後台手動編輯廣告組合嘅目標受眾時會自動記低（客戶都睇到），一般唔使自己喺JSON度寫，keep空array就得。<br>
        <b>objective</b>可以係：Awareness（觸及/知名度）、Traffic（流量）、Engagement（互動）、Leads（潛在客戶）、Sales（轉換/銷售）、AppPromotion（應用程式推廣）。<br>
        <b>results</b>視乎objective：Traffic=連結點擊、Engagement=互動次數、Leads=名單數、Sales=轉換次數、AppPromotion=安裝次數；Awareness唔使填，會自動用返reach計。
      </p>
      <p style="font-size:12px;color:var(--ink-dim)">貼士：開新Claude對話，將上面格式連同你想更新嘅內容一齊講畀Claude聽，叫佢淨係出返JSON，然後貼落嚟。</p>
      <textarea class="json" id="importBox" placeholder="貼上JSON..."></textarea>
      <div class="footer-actions">
        <button class="primary" id="importBtn">匯入（取代目前客戶資料）</button>
        <button id="exportBtn">匯出目前客戶JSON</button>
      </div>
      <div id="syncMsg"></div>
    </div>
  `;
  document.getElementById('exportBtn').addEventListener('click', () => {
    document.getElementById('importBox').value = JSON.stringify(currentData, null, 2);
    showMsg('ok', '已將目前客戶資料放入上面文字框，可以複製出去。');
  });
  document.getElementById('importBtn').addEventListener('click', async () => {
    const raw = document.getElementById('importBox').value;
    try{
      const parsed = JSON.parse(raw.replace(/\/\/.*$/gm, ''));
      if(!parsed.quota || !TYPES.every(t=>parsed.quota[t])) throw new Error('quota部分缺少 static/carousel/reels');
      const quota = {};
      TYPES.forEach(t => {
        const q = parsed.quota[t] || {};
        quota[t] = { signed: +q.signed || 0, usedBaseline: +(q.usedBaseline !== undefined ? q.usedBaseline : q.used) || 0 };
      });
      const posts = (parsed.posts||[]).map(p => ({
        id: p.id || uid(),
        date: p.date || '',
        type: TYPES.includes(p.type) ? p.type : 'static',
        title: p.title || '未命名貼文',
        hours: +p.hours || 0,
        status: p.status === 'draft' ? 'draft' : 'delivered'
      }));
      const campaigns = (parsed.campaigns||[]).map(c => ({
        id: c.id || uid(),
        name: c.name || '未命名活動',
        objective: OBJECTIVES[c.objective] ? c.objective : 'Traffic',
        notes: c.notes || '',
        adsets: (c.adsets||[]).map(as => ({
          id: as.id || uid(),
          name: as.name || '未命名組合',
          startDate: as.startDate || '',
          endDate: as.endDate || '',
          budgetHKD: +as.budgetHKD || 0,
          targeting: as.targeting || emptyTargeting(),
          changeLog: Array.isArray(as.changeLog) ? as.changeLog : [],
          ads: (as.ads||[]).map(a => ({
            id: a.id || uid(),
            name: a.name || '未命名廣告',
            spendHKD: +a.spendHKD || 0,
            reach: +a.reach || 0,
            clicks: +a.clicks || 0,
            results: +a.results || 0,
            notes: a.notes || ''
          }))
        }))
      }));
      currentData = { name: parsed.name || currentData.name, metaAdAccountId: parsed.metaAdAccountId !== undefined ? parsed.metaAdAccountId : (currentData.metaAdAccountId||''), quota, posts, campaigns };
      const c = clients.find(c=>c.id===currentId);
      if(c && parsed.name) { c.name = parsed.name; await saveIndex(); }
      await saveClient(currentId, currentData);
      renderQuotaTab(); renderAdsTab(); renderClientSelect();
      document.getElementById('subhead').textContent = subheadText(currentData);
      showMsg('ok', '匯入成功。');
    }catch(e){
      showMsg('err', '匯入失敗：' + e.message);
    }
  });
}
function showMsg(type, text){
  const m = document.getElementById('syncMsg');
  m.innerHTML = `<div class="msg ${type}">${escapeHtml(text)}</div>`;
  setTimeout(()=>{ if(m) m.innerHTML=''; }, 4000);
}

/* ---------- ADMIN PASSCODE GATE ---------- */
async function initWithGate(){
  const root = document.getElementById('root');
  let saved = await getPasscode();
  if(!saved){
    root.innerHTML = `<div class="lockwrap"><img class="brand-logo" src="logo.png" alt=""><h1>設定管理密碼</h1>
      <p class="sub">第一次使用，請設定一個管理密碼（之後編輯資料時需要輸入）。呢個密碼會儲存喺呢個作品內，客戶連結唔會受影響。</p>
      <input id="setPass" type="password" placeholder="輸入新密碼">
      <button class="primary" id="setPassBtn" style="width:100%">確認設定</button></div>`;
    document.getElementById('setPassBtn').addEventListener('click', async () => {
      const v = document.getElementById('setPass').value;
      if(!v){ return; }
      await setPasscode(v);
      initAdmin();
    });
    return;
  }
  root.innerHTML = `<div class="lockwrap"><img class="brand-logo" src="logo.png" alt=""><h1>管理登入</h1>
    <p class="sub">請輸入管理密碼以編輯客戶資料</p>
    <input id="passInput" type="password" placeholder="密碼">
    <button class="primary" id="passBtn" style="width:100%">登入</button>
    <div id="passMsg" class="msg" style="display:none"></div></div>`;
  document.getElementById('passBtn').addEventListener('click', () => {
    const v = document.getElementById('passInput').value;
    if(v === saved){ initAdmin(); }
    else{
      const m = document.getElementById('passMsg');
      m.style.display='block'; m.className='msg err'; m.textContent='密碼錯誤，請再試。';
    }
  });
  document.getElementById('passInput').addEventListener('keydown', e=>{
    if(e.key==='Enter') document.getElementById('passBtn').click();
  });
}

/* ---------- ENTRY ---------- */
if(isClientView){ renderClientView(); }
else{ initWithGate(); }
</script>
