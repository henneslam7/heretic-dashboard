<style>
  :root{
    --bg:#15171b; --panel:#1d2026; --panel2:#23262e; --line:#2c3038;

  h1{font-size:20px;font-weight:700;letter-spacing:-0.01em;margin:0 0 2px;}
  .sub{color:var(--ink-dim);font-size:13px;margin:0 0 20px;}
  .brand-logo{display:inline-block;height:96px;width:auto;margin:4px 0 14px;}
  .toprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  select, input, textarea, button{
    font-family:inherit;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;
  }
  select{min-width:160px;}
  button{cursor:pointer;background:var(--panel2);transition:border-color .15s;}
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);color:#0c1210;border-color:var(--accent);font-weight:600;}
  button.danger{color:var(--danger);}
  button.small{padding:4px 8px;font-size:12px;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  .tab{padding:9px 14px;font-size:13px;color:var(--ink-dim);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--ink);border-color:var(--accent);}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:640px){.grid3{grid-template-columns:1fr;}}
  .quota-card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;}
  .quota-card .label{font-size:12px;color:var(--ink-dim);letter-spacing:.04em;margin-bottom:6px;}
  .quota-card .nums{font-size:22px;font-weight:700;}

  .qctrl input{width:56px;padding:4px 6px;text-align:center;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}

  td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .status-pill{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .status-launched{background:#1f3d2e;color:#7fe0a3;}

  .field-row label{font-size:11px;color:var(--ink-dim);display:block;margin-bottom:3px;}

  .schema{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--ink-dim);white-space:pre;overflow-x:auto;}

  .client-card h3{margin:0 0 6px;font-size:15px;}
  .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 16px;font-size:12.5px;color:var(--ink-dim);margin-top:8px;}

  .ad-stat-card:last-child{margin-bottom:0;}
  .ad-stat-name-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .ad-stat-name{font-size:12.5px;color:var(--ink-dim);}

  .ad-stat-hero .num{font-size:22px;font-weight:700;color:var(--accent);}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = 'clientPortal';

const TYPES = ['static','carousel','reels'];
const TYPE_LABEL = {static:'靜態圖', carousel:'輪播圖', reels:'Reels / 影片'};
const STATUS_LABEL = {Scheduled:'排程中', Launched:'已上線', Ended:'已結束', BudgetExhausted:'預算已用盡'};
const OBJECTIVES = {
  Awareness:    { label:'觸及 / 知名度', resultLabel:'觸及人次',   costLabel:'CPM（每千次觸及）' },
  Traffic:      { label:'流量',         resultLabel:'連結點擊',   costLabel:'CPC（每次點擊成本）' },
  Engagement:   { label:'互動',         resultLabel:'互動次數',   costLabel:'每次互動成本' },
  Leads:        { label:'潛在客戶',      resultLabel:'名單數',    costLabel:'每個名單成本' },
  Sales:        { label:'轉換 / 銷售',   resultLabel:'轉換次數',   costLabel:'每次轉換成本' },
  AppPromotion: { label:'應用程式推廣',   resultLabel:'安裝次數',   costLabel:'每次安裝成本' }
};
// Leads campaigns can collect leads via an Instant Form OR via a Messenger/WhatsApp/IG
// conversation -- both are the same "Leads" objective in Meta's own model, just a
// different result metric depending on the ad set's conversion destination.
const LEADS_RESULT_TYPES = {
  form:     { resultLabel:'名單數',      costLabel:'每個名單成本' },
  messages: { resultLabel:'對話開始次數', costLabel:'每次對話開始成本' }
};
function getResultMeta(objective, resultType){
  if(objective === 'Leads' && resultType === 'messages') return LEADS_RESULT_TYPES.messages;
  const obj = OBJECTIVES[objective] || OBJECTIVES.Traffic;
  return { resultLabel: obj.resultLabel, costLabel: obj.costLabel };
}
const OBJECTIVE_KEYS = Object.keys(OBJECTIVES);
let clients = [];
let currentId = null;
let currentData = null;
let calYear = null, calMonth = null; // calMonth is 0-indexed (Date convention)
let adsYear = null, adsMonth = null; // separate month cursor for the Ads tab's month grouping
// collapse/expand UI state for the ads tab (admin + public), keyed by id, survives re-renders but not page reloads
const collapsedCampaigns = new Set();
const collapsedAdsets = new Set();
const collapsedAds = new Set();

const params = new URLSearchParams(location.search);
const isClientView = params.get('view') === 'client';
const clientViewId = params.get('id');

function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function subheadText(data){ return `正在編輯：${data.name}${data.metaAdAccountId ? ' · Meta帳戶：'+data.metaAdAccountId : ''}`; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function emptyClientData(name){
  return {
    name,
    metaAdAccountId: '',
    quota: {
      static:   {signed:0, usedBaseline:0},
      carousel: {signed:0, usedBaseline:0},
      reels:    {signed:0, usedBaseline:0}
    },
    posts: [],
    campaigns: []
  };
}
function emptyTargeting(){
  return { age:'', gender:'不限', location:'', interests:'', placement:'' };
}

/* ---------- targeting change log (auto-detected on ad set edit, shown to admin + client) ---------- */
function splitInterests(s){
  return (s||'').split(/[,，、]/).map(x=>x.trim()).filter(Boolean);
}
function diffTargeting(oldTg, newTg){
  oldTg = oldTg || emptyTargeting();
  newTg = newTg || emptyTargeting();
  const labels = { age:'年齡層', gender:'性別', location:'地區', placement:'版位' };
  const changes = [];
  Object.keys(labels).forEach(f => {
    const from = (oldTg[f]||'').trim(), to = (newTg[f]||'').trim();
    if(from !== to) changes.push({ field:f, label:labels[f], from: from||'—', to: to||'—' });
  });
  const oldInt = splitInterests(oldTg.interests), newInt = splitInterests(newTg.interests);
  if(oldInt.join('|') !== newInt.join('|')){
    const added = newInt.filter(x=>!oldInt.includes(x));
    const removed = oldInt.filter(x=>!newInt.includes(x));
    if(added.length || removed.length) changes.push({ field:'interests', label:'興趣', added, removed });
    else changes.push({ field:'interests', label:'興趣', from: oldTg.interests||'—', to: newTg.interests||'—' });
  }
  return changes;
}
function describeChangeHtml(ch){
  if(ch.added || ch.removed){
    const parts = [];
    if(ch.added && ch.added.length) parts.push('新增「'+ch.added.map(escapeHtml).join('、')+'」');
    if(ch.removed && ch.removed.length) parts.push('移除「'+ch.removed.map(escapeHtml).join('、')+'」');
    return escapeHtml(ch.label)+'：'+parts.join('，');
  }
  return escapeHtml(ch.label)+'：'+escapeHtml(ch.from)+' → '+escapeHtml(ch.to);
}
function renderChangeLog(changeLog, editable, campId, adsetId){
  if(!changeLog || !changeLog.length) return '';
  const entries = changeLog.slice().reverse().map(entry => {
    const items = (entry.changes||[]).map(ch=>`<div>${describeChangeHtml(ch)}</div>`).join('');
    const actions = editable ? `<div class="row-actions">
        <button class="small changelog-del" data-editchange="${campId}|${adsetId}|${entry.id}">編輯</button>
        <button class="small danger changelog-del" data-delchange="${campId}|${adsetId}|${entry.id}">刪除</button>
      </div>` : '';
    return `<div class="changelog-entry"><div class="changelog-entry-head"><b>${escapeHtml(entry.date)}</b>${actions}</div>${items}</div>`;
  }).join('');
  return `<div class="section-h">📝 投放調整紀錄</div><div class="changelog">${entries}</div>`;
}

/* ---------- campaign-level performance insight (shown once per campaign, not per ad set) ---------- */
const CIRCLED_NUMS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
function formatCampaignNotes(notes){
  if(!notes) return { summaryParas: [], recItems: [] };
  const idx = notes.search(/\(1\)/);
  // strip a trailing lead-in phrase like "下次投放建議：" before "(1)" -- it's
  // redundant with our own "💡 下次投放建議" section header below.
  const summaryText = (idx >= 0 ? notes.slice(0, idx) : notes)
    .replace(/[，,。]?\s*(下次)?(投放)?建議\s*[:：]?\s*$/, '')
    .trim();
  const recText = idx >= 0 ? notes.slice(idx).trim() : '';
  const summaryParas = summaryText.split(/(?<=。)/).map(s=>s.trim()).filter(Boolean);
  const recItems = recText ? recText.split(/\(\d+\)\s*/).map(s=>s.trim()).filter(Boolean) : [];
  return { summaryParas, recItems };
}
function renderCampaignInsightBody(c){
  if(!c.notes) return '';
  const { summaryParas, recItems } = formatCampaignNotes(c.notes);
  return `${summaryParas.length ? `<div class="insight-label">📈 成效總結</div><div class="insight-body">${summaryParas.map(p=>`<p class="summary">${escapeHtml(p)}</p>`).join('')}</div>` : ''}
    ${recItems.length ? `<div class="insight-label">💡 下次投放建議</div><div class="insight-body">${recItems.map((p,i)=>`<p>${CIRCLED_NUMS[i]||(i+1)+'.'} ${escapeHtml(p)}</p>`).join('')}</div>` : ''}`;
}

/* ---------- group (campaign,adset) pairs by campaign, ordered active-first then by earliest ad set date ---------- */
function groupAndSortPairs(pairs){
  const order = [];
  const map = new Map();
  pairs.forEach(({c,as}) => {
    if(!map.has(c.id)){ map.set(c.id, {c, adsets:[]}); order.push(c.id); }
    map.get(c.id).adsets.push(as);
  });
  const groups = order.map(id => map.get(id));
  groups.forEach(g => g.adsets.sort((a,b) => (a.startDate||'9999-99-99').localeCompare(b.startDate||'9999-99-99')));
  const isActive = g => g.adsets.some(as => computeAdSetStatus(as) === 'Launched');
  const earliestDate = g => g.adsets.reduce((min,as) => { const d = as.startDate || '9999-99-99'; return d < min ? d : min; }, '9999-99-99');
  groups.sort((g1,g2) => {
    const a1 = isActive(g1) ? 0 : 1, a2 = isActive(g2) ? 0 : 1;
    if(a1 !== a2) return a1 - a2;
    return earliestDate(g1).localeCompare(earliestDate(g2));
  });
  return groups;
}

/* Legacy flat "ads" array (pre Campaign > Ad Set > Ad) -> nested campaigns shape.
   Also migrates quota.<type>.used (a manually-typed running total, no per-post
   detail) into quota.<type>.usedBaseline, and ensures a posts[] log exists —
   "已用" is now computed as usedBaseline + count of posts of that type, so
   pre-existing totals aren't lost even though we don't know which specific
   dates/titles they came from. */
function migrateClientData(data){
  if(!data) return data;
  if(!data.campaigns){
    const legacyAds = data.ads || [];
    data.campaigns = legacyAds.map(a => ({
      id: a.id || uid(),
      name: a.name || '未命名活動',
      objective: 'Traffic',
      notes: '',
      adsets: [{
        id: uid(),
        name: a.name || '未命名廣告組合',
        startDate: a.startDate || '',
        endDate: a.endDate || '',
        budgetHKD: +a.budgetHKD || 0,
        targeting: a.targeting || emptyTargeting(),
        ads: [{
          id: uid(),
          name: a.name || '未命名廣告',
          spendHKD: +a.spendHKD || 0,
          reach: +a.reach || 0,
          clicks: +a.clicks || 0,
          results: +a.clicks || 0,
          notes: a.notes || ''
        }]
      }]
    }));
    delete data.ads;
  }
  if(!Array.isArray(data.posts)) data.posts = [];
  TYPES.forEach(t => {
    const q = data.quota && data.quota[t];
    if(!q) return;
    if(q.usedBaseline === undefined){
      q.usedBaseline = +q.used || 0;
      delete q.used;
    }
  });
  return data;
}

/* ---------- post calendar (shared by admin + public view) ---------- */
function isDraftPost(p){ return p.status === 'draft'; }
function computeUsed(data, type){
  const baseline = +(data.quota?.[type]?.usedBaseline) || 0;
  const logged = (data.posts||[]).filter(p => p.type === type && !isDraftPost(p)).length;
  return baseline + logged;
}
function computeMonthlyHours(posts, year, month){
  const prefix = `${year}-${String(month+1).padStart(2,'0')}`;
  const totals = { static:0, carousel:0, reels:0 };
  (posts||[]).forEach(p => {
    if(p.date && p.date.startsWith(prefix) && totals[p.type] !== undefined) totals[p.type] += +p.hours || 0;
  });
  return totals;
}

const WEEKDAY_LABEL = ['日','一','二','三','四','五','六'];
function renderCalendarGrid(posts, year, month, editable){
  const startOffset = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const postsByDate = {};
  (posts||[]).forEach(p => { (postsByDate[p.date] = postsByDate[p.date]||[]).push(p); });

  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push('<div class="cal-day empty"></div>');
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayPosts = postsByDate[dateStr] || [];
    const pills = dayPosts.map(p =>
      `<div class="cal-post ${p.type}${isDraftPost(p) ? ' cal-post-draft' : ''}"${editable ? ` data-editpost="${p.id}"` : ''} title="${escapeHtml(p.title)}${isDraftPost(p) ? '（草稿）' : ''}">${isDraftPost(p) ? '📝 ' : ''}${escapeHtml(p.title)}</div>`
    ).join('');
    const addBtn = editable ? `<button class="cal-add" data-adddate="${dateStr}" title="加貼文紀錄">＋</button>` : '';
    cells.push(`<div class="cal-day"><div class="cal-daynum">${d}</div>${pills}${addBtn}</div>`);
  }
  return `
    <div class="cal-grid cal-weekdays">${WEEKDAY_LABEL.map(w=>`<div class="cal-weekday">${w}</div>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
  `;
}

/* ---------- month-grouping helper (shared by ads tab admin + public view) ---------- */
function monthsSpanned(startDate, endDate){
  if(!startDate && !endDate) return [];
  const start = startDate ? new Date(startDate+'T00:00:00') : new Date(endDate+'T00:00:00');
  const end = endDate ? new Date(endDate+'T00:00:00') : start;
  const months = [];
  let y = start.getFullYear(), m = start.getMonth();
  const endY = end.getFullYear(), endM = end.getMonth();
  let guard = 0;
  while((y < endY || (y===endY && m<=endM)) && guard < 120){
    months.push(y+'-'+m);
    m++; if(m>11){ m=0; y++; }
    guard++;
  }
  return months;
}
function adsetInMonth(adset, year, month){
  return monthsSpanned(adset.startDate, adset.endDate).includes(year+'-'+month);
}

/* ---------- ad set status / ad metrics (shared by admin + public view) ---------- */
function computeAdSetStatus(adset){
  const spend = (adset.ads||[]).reduce((s,a)=>s+(+a.spendHKD||0),0);
  const today = new Date().toISOString().slice(0,10);
  if((+adset.budgetHKD||0) > 0 && spend >= (+adset.budgetHKD||0)) return 'BudgetExhausted';
  if(adset.endDate && today > adset.endDate) return 'Ended';
  if(adset.startDate && today < adset.startDate) return 'Scheduled';
  return 'Launched';
}
function statusPillClass(s){
  if(s==='Launched') return 'status-launched';
  if(s==='Scheduled') return 'status-scheduled';
  if(s==='BudgetExhausted') return 'status-budget';
  return 'status-ended';
}
function adMetrics(ad, objective, resultType){
  const spend = +ad.spendHKD||0, reach = +ad.reach||0, clicks = +ad.clicks||0;
  const ctr = (clicks && reach) ? ((clicks/reach)*100).toFixed(2)+'%' : '—';
  const meta = getResultMeta(objective, resultType);
  let resultValue, costPerResult;
  if(objective === 'Awareness'){
    resultValue = reach;
    costPerResult = reach ? 'HK$' + (spend/reach*1000).toFixed(2) : '—';
  }else{
    resultValue = +ad.results||0;
    costPerResult = resultValue ? 'HK$' + (spend/resultValue).toFixed(2) : '—';
  }
  return { ctr, resultValue, costPerResult, resultLabel: meta.resultLabel, costLabel: meta.costLabel };
}
function adStatGridCells(a, m, objective){
  const spend = `<div>花費<b>HK$${(+a.spendHKD||0).toLocaleString()}</b></div>`;
  const clicks = `<div>點擊<b>${(+a.clicks||0).toLocaleString()}</b></div>`;
  const ctr = `<div>CTR<b>${m.ctr}</b></div>`;
  if(objective === 'Awareness'){
    const reach = `<div>觸及<b>${(+a.reach||0).toLocaleString()}</b></div>`;
    return spend + reach + clicks + ctr;
  }
  const result = `<div>${escapeHtml(m.resultLabel)}<b>${m.resultValue.toLocaleString()}</b></div>`;
  return spend + result + clicks + ctr;
}

    return;
  }
  const quotaCards = TYPES.map(t=>{
    const q = data.quota[t];
    const used = computeUsed(data, t);
    const remaining = q.signed - used;
    const pct = q.signed>0 ? Math.min(100,(used/q.signed)*100) : 0;
    return `<div class="quota-card">
      <div class="label">${TYPE_LABEL[t]}</div>

  const campaigns = data.campaigns || [];

  const allPairs = [];
  campaigns.forEach(c => (c.adsets||[]).forEach(as => allPairs.push({ c, as })));
  const thisMonthPairs = allPairs.filter(({as}) => adsetInMonth(as, adsYear, adsMonth));
  const thisMonthGroups = groupAndSortPairs(thisMonthPairs);
  const campaignCards = thisMonthGroups.length
    ? thisMonthGroups.map(g => renderCampaignGroup(g, false)).join('')
    : '<div class="empty">呢個月暫時未有廣告投放記錄。</div>';

  root.innerHTML = `

        <div class="section-label" style="margin-top:0">貼文名額</div>
        <div class="grid3">${quotaCards}</div>
      </div>
      <div class="panel">
        <div class="cal-head">
          <button class="small" id="calPrevBtn">‹</button>
          <div class="cal-title">${calYear}年${calMonth+1}月</div>
          <button class="small" id="calNextBtn">›</button>
        </div>
        ${renderCalendarGrid((data.posts||[]).filter(p => !isDraftPost(p)), calYear, calMonth, false)}
        <div class="cal-legend">
          ${TYPES.map(t=>`<span class="cal-legend-item"><span class="cal-dot ${t}"></span>${TYPE_LABEL[t]}</span>`).join('')}
        </div>
      </div>
      <div class="cal-head">
        <button class="small" id="adsPrevBtn">‹</button>
        <div class="cal-title">${adsYear}年${adsMonth+1}月嘅Meta廣告投放</div>
        <button class="small" id="adsNextBtn">›</button>
      </div>
      ${campaignCards}
    </div>
  `;
  document.getElementById('calPrevBtn').addEventListener('click', () => { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderClientView(); });
  document.getElementById('calNextBtn').addEventListener('click', () => { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderClientView(); });
  document.getElementById('adsPrevBtn').addEventListener('click', () => { adsMonth--; if(adsMonth<0){adsMonth=11;adsYear--;} renderClientView(); });
  document.getElementById('adsNextBtn').addEventListener('click', () => { adsMonth++; if(adsMonth>11){adsMonth=0;adsYear++;} renderClientView(); });
  bindCollapseToggles(root, renderClientView);
}

/* ---------- ADS TAB (Campaign > Ad Set > Ad) ---------- */
function renderAdsTab(){
  const el = document.getElementById('tab-ads');
  const campaigns = currentData.campaigns || [];
  let totalBudget = 0, totalSpend = 0;
  campaigns.forEach(c => (c.adsets||[]).forEach(as => {
    totalBudget += +as.budgetHKD||0;
    (as.ads||[]).forEach(a => totalSpend += +a.spendHKD||0);
  }));

  if(adsYear === null){ const now = new Date(); adsYear = now.getFullYear(); adsMonth = now.getMonth(); }

  // flatten (campaign, adset) pairs so we can group by month independently of campaign nesting
  const allPairs = [];
  campaigns.forEach(c => (c.adsets||[]).forEach(as => allPairs.push({ c, as })));
  const thisMonthPairs = allPairs.filter(({as}) => adsetInMonth(as, adsYear, adsMonth));
  const undatedPairs = allPairs.filter(({as}) => !as.startDate && !as.endDate);
  const thisMonthGroups = groupAndSortPairs(thisMonthPairs);
  const undatedGroups = groupAndSortPairs(undatedPairs);

  el.innerHTML = `
    <div class="panel">
      <div class="footer-actions" style="margin-top:0;margin-bottom:10px;">
        <button class="primary" id="addCampaignBtn">＋ 新增行銷活動 (Campaign)</button>
        <span class="totals" style="align-self:center">總預算：HK$${totalBudget.toLocaleString()} · 總花費：HK$${totalSpend.toLocaleString()}</span>
      </div>
      ${campaigns.length ? renderCampaignStrip(campaigns) : '<div class="empty">未有廣告活動記錄。</div>'}
    </div>

    <div class="cal-head">
      <button class="small" id="adsPrevBtn">‹</button>
      <div class="cal-title">${adsYear}年${adsMonth+1}月嘅廣告投放</div>
      <button class="small" id="adsNextBtn">›</button>
    </div>
    ${thisMonthGroups.length ? thisMonthGroups.map(g=>renderCampaignGroup(g,true)).join('') : '<div class="empty">呢個月冇廣告組合投放。</div>'}

    ${undatedGroups.length ? `<div class="noundated-block">
      <div class="section-label">未定日期嘅廣告組合</div>
      ${undatedGroups.map(g=>renderCampaignGroup(g,true)).join('')}
    </div>` : ''}

    <div id="adFormHolder"></div>
  `;
  document.getElementById('addCampaignBtn').addEventListener('click', () => showCampaignForm(null));
  document.getElementById('adsPrevBtn').addEventListener('click', () => { adsMonth--; if(adsMonth<0){adsMonth=11;adsYear--;} renderAdsTab(); });
  document.getElementById('adsNextBtn').addEventListener('click', () => { adsMonth++; if(adsMonth>11){adsMonth=0;adsYear++;} renderAdsTab(); });
  wireAdsTabEvents(el);
}

function renderCampaignStrip(campaigns){

/* ---------- collapse/expand toggles for campaign/adset/ad cards (shared by admin + public view) ---------- */
function bindCollapseToggles(el, rerender){
  el.querySelectorAll('[data-toggle-campaign]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.toggleCampaign;
    if(collapsedCampaigns.has(id)) collapsedCampaigns.delete(id); else collapsedCampaigns.add(id);
    rerender();
  }));
  el.querySelectorAll('[data-toggle-adset]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.toggleAdset;
    if(collapsedAdsets.has(id)) collapsedAdsets.delete(id); else collapsedAdsets.add(id);
    rerender();
  }));
  el.querySelectorAll('[data-toggle-ad]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.dataset.toggleAd;
    if(collapsedAds.has(id)) collapsedAds.delete(id); else collapsedAds.add(id);
    rerender();
  }));
}

function showChangeLogEditForm(campId, adsetId, changeId){
  const camp = currentData.campaigns.find(c=>c.id===campId);
  const as = camp.adsets.find(x=>x.id===adsetId);
  const entry = (as.changeLog||[]).find(e=>e.id===changeId);
  if(!entry) return;
  const holder = document.getElementById('adFormHolder');
  const rows = (entry.changes||[]).map((ch, i) => {
    if(ch.added || ch.removed){
      return `<div class="field-row">
        <div><label>${escapeHtml(ch.label)}（新增，用「、」分隔）</label><input id="f_chg_${i}_added" value="${escapeHtml((ch.added||[]).join('、'))}"></div>
        <div><label>${escapeHtml(ch.label)}（移除，用「、」分隔）</label><input id="f_chg_${i}_removed" value="${escapeHtml((ch.removed||[]).join('、'))}"></div>
      </div>`;
    }
    return `<div class="field-row">
      <div><label>${escapeHtml(ch.label)}（由）</label><input id="f_chg_${i}_from" value="${escapeHtml(ch.from||'')}"></div>
      <div><label>${escapeHtml(ch.label)}（去）</label><input id="f_chg_${i}_to" value="${escapeHtml(ch.to||'')}"></div>
    </div>`;
  }).join('');
  holder.innerHTML = `
    <div class="panel">
      <div class="section-label" style="margin-top:0">編輯投放調整紀錄 － ${escapeHtml(as.name)}</div>
      <div class="field-row">
        <div><label>日期</label><input type="date" id="f_chg_date" value="${entry.date||''}"></div>
      </div>
      ${rows}
      <div class="footer-actions">
        <button class="primary" id="saveChangeLogBtn">儲存</button>
        <button id="cancelChangeLogBtn">取消</button>
      </div>
    </div>
  `;
  document.getElementById('cancelChangeLogBtn').addEventListener('click', () => holder.innerHTML='');
  document.getElementById('saveChangeLogBtn').addEventListener('click', async () => {
    entry.date = document.getElementById('f_chg_date').value || entry.date;
    entry.changes = (entry.changes||[]).map((ch, i) => {
      if(ch.added || ch.removed){
        const added = splitInterests(document.getElementById(`f_chg_${i}_added`).value);
        const removed = splitInterests(document.getElementById(`f_chg_${i}_removed`).value);
        return { field: ch.field, label: ch.label, added, removed };
      }
      const from = document.getElementById(`f_chg_${i}_from`).value.trim() || '—';
      const to = document.getElementById(`f_chg_${i}_to`).value.trim() || '—';
      return { field: ch.field, label: ch.label, from, to };
    });
    await saveClient(currentId, currentData);
    holder.innerHTML='';
    renderAdsTab();
  });
}

        const q = parsed.quota[t] || {};

      });
      const posts = (parsed.posts||[]).map(p => ({

        objective: OBJECTIVES[c.objective] ? c.objective : 'Traffic',

          id: as.id || uid(),
          name: as.name || '未命名組合',
          startDate: as.startDate || '',
          endDate: as.endDate || '',
          budgetHKD: +as.budgetHKD || 0,
          targeting: as.targeting || emptyTargeting(),
          changeLog: Array.isArray(as.changeLog) ? as.changeLog : [],
          ads: (as.ads||[]).map(a => ({
            id: a.id || uid(),
            name: a.name || '未命名廣告',
            spendHKD: +a.spendHKD || 0,
            reach: +a.reach || 0,
            clicks: +a.clicks || 0,
            results: +a.results || 0,
            notes: a.notes || ''
          }))
        }))
      }));
      currentData = { name: parsed.name || currentData.name, metaAdAccountId: parsed.metaAdAccountId !== undefined ? parsed.metaAdAccountId : (currentData.metaAdAccountId||''), quota, posts, campaigns };
      const c = clients.find(c=>c.id===currentId);
      if(c && parsed.name) { c.name = parsed.name; await saveIndex(); }
      await saveClient(currentId, currentData);
      renderQuotaTab(); renderAdsTab(); renderClientSelect();
      document.getElementById('subhead').textContent = subheadText(currentData);
      showMsg('ok', '匯入成功。');
    }catch(e){
      showMsg('err', '匯入失敗：' + e.message);
    }
  });
}
function showMsg(type, text){
  const m = document.getElementById('syncMsg');
  m.innerHTML = `<div class="msg ${type}">${escapeHtml(text)}</div>`;
  setTimeout(()=>{ if(m) m.innerHTML=''; }, 4000);
}

/* ---------- ADMIN PASSCODE GATE ---------- */
async function initWithGate(){
  const root = document.getElementById('root');
  let saved = await getPasscode();
  if(!saved){
    root.innerHTML = `<div class="lockwrap"><img class="brand-logo" src="logo.png" alt=""><h1>設定管理密碼</h1>
      <p class="sub">第一次使用，請設定一個管理密碼（之後編輯資料時需要輸入）。呢個密碼會儲存喺呢個作品內，客戶連結唔會受影響。</p>
      <input id="setPass" type="password" placeholder="輸入新密碼">
      <button class="primary" id="setPassBtn" style="width:100%">確認設定</button></div>`;
    document.getElementById('setPassBtn').addEventListener('click', async () => {
      const v = document.getElementById('setPass').value;
      if(!v){ return; }
      await setPasscode(v);
      initAdmin();
    });
    return;
  }
  root.innerHTML = `<div class="lockwrap"><img class="brand-logo" src="logo.png" alt=""><h1>管理登入</h1>
    <p class="sub">請輸入管理密碼以編輯客戶資料</p>
    <input id="passInput" type="password" placeholder="密碼">
    <button class="primary" id="passBtn" style="width:100%">登入</button>
    <div id="passMsg" class="msg" style="display:none"></div></div>`;
  document.getElementById('passBtn').addEventListener('click', () => {
    const v = document.getElementById('passInput').value;
    if(v === saved){ initAdmin(); }
    else{
      const m = document.getElementById('passMsg');
      m.style.display='block'; m.className='msg err'; m.textContent='密碼錯誤，請再試。';
    }
  });
  document.getElementById('passInput').addEventListener('keydown', e=>{
    if(e.key==='Enter') document.getElementById('passBtn').click();
  });
}

/* ---------- ENTRY ---------- */
if(isClientView){ renderClientView(); }
else{ initWithGate(); }
